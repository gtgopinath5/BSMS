services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://baywatch:baywatch@postgres:5432/baywatch
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      MINIO_URL: http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./:/code

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baywatch
      POSTGRES_PASSWORD: baywatch
      POSTGRES_DB: baywatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data

  celery_worker:
    build: .
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://baywatch:baywatch@postgres:5432/baywatch
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - redis
      - postgres
    volumes:
      - ./:/code

  celery_beat:
    build: .
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - redis
    volumes:
      - ./:/code

volumes:
  pgdata:
  miniodata:

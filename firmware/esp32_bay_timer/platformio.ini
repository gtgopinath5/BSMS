; Baywatch ESP32 Bay Timer — PlatformIO project
; Build:  pio run
; Flash:  pio run -t upload
; Monitor: pio device monitor -b 115200
;
; One firmware per bay — set BAY_NUMBER + WiFi/broker in include/config.h.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8          ; MQTT client
    bblanchon/ArduinoJson@^7.1.0          ; parse the timer state payload
    adafruit/Adafruit NeoPixel@^1.12.3    ; WS2812 RGB LED (colour stages)
    avishorp/TM1637@^1.2.0                ; 4-digit 7-seg countdown display

build_flags =
    -DCORE_DEBUG_LEVEL=1
